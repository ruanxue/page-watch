name: page-watch

x-page-watch-environment: &page-watch-environment
  OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
  # Optional legacy bootstrap values. New deployments configure MySQL in the
  # browser and store it encrypted in the persistent Page Watch data folder.
  MYSQL_HOST: ${MYSQL_HOST:-}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-}
  MYSQL_USER: ${MYSQL_USER:-}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
  MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-3}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请在 deploy/.env 配置 APP_ENCRYPTION_KEY}

x-page-watch-service: &page-watch-service
  image: ${PAGE_WATCH_IMAGE:?请在 deploy/.env 配置 PAGE_WATCH_IMAGE}
  platform: linux/amd64
  init: true
  restart: unless-stopped
  environment:
    <<: *page-watch-environment

services:
  app:
    <<: *page-watch-service
    container_name: pagewatch
    shm_size: 1gb
    ports:
      - "${PAGE_WATCH_PORT:-3030}:3030"
    environment:
      <<: *page-watch-environment
      PORT: 3030
      PAGE_WATCH_BOOTSTRAP_PATH: /data/database-bootstrap.json
      APP_SESSION_SECURE: ${APP_SESSION_SECURE:-false}
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3030/api/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  default:
    name: ${PAGE_WATCH_NETWORK:-page-watch-backend}
    external: true
