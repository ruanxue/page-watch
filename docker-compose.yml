services:
  app:
    build: .
    command: npm run all-in-one
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3030:3030"
    environment:
      PORT: 3030
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_SESSION_SECURE: ${APP_SESSION_SECURE:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3030/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
