services:
  app:
    build: .
    container_name: pagewatch
    command: node build/server/all-in-one.js
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3030:3030"
    environment:
      PORT: 3030
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
      # PostgreSQL 连接留空则在网页安装引导中填写。
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      PAGE_WATCH_BOOTSTRAP_PATH: /data/database-bootstrap.json
      # Used only to find an existing key while migrating legacy pwenc:v1 data.
      PAGE_WATCH_ENCRYPTION_KEY_PATH: /data/app-encryption-key
      # Migration-only: keep the original value while upgrading legacy pwenc:v1 data.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_SESSION_SECURE: ${APP_SESSION_SECURE:-false}
      # 部署在反向代理后面时设为 true（或填写信任网段，如 172.16.0.0/12），
      # 让登录限流取到真实客户端 IP；直接暴露端口时保持 false。
      APP_TRUST_PROXY: ${APP_TRUST_PROXY:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3030/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
